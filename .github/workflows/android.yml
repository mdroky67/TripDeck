name: Build APK

# Every push produces an APK. Download it from Actions → latest run → Artifacts.
# Tagging v* also attaches it to a Release, which doesn't expire.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the web app (base is "/" inside an APK)
        run: BASE=/ npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Capacitor sync
        run: npx cap sync android

      # A signed release build when the keystore secret is present, so the
      # app's fingerprint stays the same and updates install over each other.
      # Without the secret it falls back to a debug build, which still runs.
      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/keystore.p12
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret; building unsigned debug."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_REDIRECT_SCHEME: ${{ secrets.GOOGLE_REDIRECT_SCHEME }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Name the file
        run: |
          mkdir -p out
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/TripDeck-$SHORT.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/TripDeck-$SHORT-debug.apk"
          fi
          rm -f android/keystore.p12
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TripDeck-apk
          path: out/*.apk
          retention-days: 90

      - name: Attach to the release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            Download the APK and open it on the phone.
            Android will ask for permission to install from unknown sources the first time.
